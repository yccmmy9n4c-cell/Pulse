name: Pulse Linux x64 Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pulse Linux package version
        required: true
        default: 8.0.1.2
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-x64-build.yml'
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
  pull_request:
    paths:
      - '.github/workflows/linux-x64-build.yml'
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'

permissions:
  contents: write

concurrency:
  group: pulse-linux-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package-test:
    name: Build, package, and inspect linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PULSE_VERSION: ${{ inputs.version || '8.0.1.2' }}
      PULSE_EDITION: DE
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
      AVALONIA_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify source baseline and release version
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          expected = os.environ["PULSE_VERSION"]
          actual = ET.parse("Directory.Build.props").getroot().findtext("./PropertyGroup/Version")
          if actual != expected:
              raise SystemExit(
                  f"Source baseline mismatch: workflow requested {expected}, but Directory.Build.props contains {actual}. "
                  "Use the complete current Pulse source at the repository root before building."
              )
          print(f"Source baseline verified: Pulse Linux Release {actual}DE")
          PY

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install GUI launch-test dependencies
        run: sudo apt-get update && sudo apt-get install --yes xvfb xauth xdotool imagemagick desktop-file-utils libx11-6 libice6 libsm6 libfontconfig1

      - name: Restore
        run: |
          dotnet restore src/Pulse.Platform.Linux/Pulse.Platform.Linux.csproj --runtime linux-x64
          dotnet restore tests/Pulse.Platform.Linux.SmokeTests/Pulse.Platform.Linux.SmokeTests.csproj --runtime linux-x64

      - name: Compile release shell
        run: >-
          dotnet msbuild src/Pulse.Platform.Linux/Pulse.Platform.Linux.csproj
          -target:Build
          -property:Configuration=Release
          -property:RuntimeIdentifier=linux-x64
          -property:Restore=false
          -property:TreatWarningsAsErrors=true
          -nodeReuse:false

      - name: Run boundary and live-provider smoke tests
        run: |
          dotnet msbuild tests/Pulse.Platform.Linux.SmokeTests/Pulse.Platform.Linux.SmokeTests.csproj -target:Build -property:Configuration=Release -property:RuntimeIdentifier=linux-x64 -property:Restore=false -property:TreatWarningsAsErrors=true -nodeReuse:false
          dotnet tests/Pulse.Platform.Linux.SmokeTests/bin/Release/net10.0/linux-x64/Pulse.Platform.Linux.SmokeTests.dll

      - name: Run one headless scheduled-assessment simulation
        run: |
          headless_root="$RUNNER_TEMP/pulse-headless-$GITHUB_RUN_ID"
          mkdir -p "$headless_root"
          XDG_DATA_HOME="$headless_root" dotnet src/Pulse.Platform.Linux/bin/Release/net10.0/linux-x64/pulse-platform.dll --assess-once
          test -n "$(find "$headless_root/Pulse Platform/Reports" -maxdepth 1 -name '*.html' -print -quit)"
          test -n "$(find "$headless_root/Pulse Platform/Assessments" -maxdepth 1 -name '*.json' -print -quit)"

      - name: Build portable and Debian packages
        run: ./packaging/build-linux.sh linux-x64 "$PULSE_VERSION"

      - name: Verify portable archive
        run: tar -tzf "artifacts/linux-x64/pulse-platform-${PULSE_VERSION}${PULSE_EDITION}-linux-x64.tar.gz" >/dev/null

      - name: Inspect Debian package
        run: |
          dpkg-deb --info "artifacts/linux-x64/pulse-platform_${PULSE_VERSION}_amd64.deb"
          dpkg-deb --contents "artifacts/linux-x64/pulse-platform_${PULSE_VERSION}_amd64.deb"
          desktop-file-validate packaging/pulse-platform.desktop

      - name: Verify checksums
        working-directory: artifacts/linux-x64
        run: |
          sha256sum --check SHA256SUMS
          if awk 'NF < 2 || $2 ~ /\// { exit 1 }' SHA256SUMS; then
            echo "Checksum manifest contains release-asset basenames only."
          else
            cat SHA256SUMS
            echo "Checksum manifest must not contain build-runner paths." >&2
            exit 1
          fi

      - name: Install the Debian package
        run: sudo dpkg --install "artifacts/linux-x64/pulse-platform_${PULSE_VERSION}_amd64.deb"

      - name: Launch, detect, and capture the installed Pulse Standard shell
        run: |
          xvfb-run --auto-servernum bash -c '
            set -euo pipefail
            /usr/bin/pulse-platform > artifacts/linux-x64/gui-launch.log 2>&1 &
            pulse_pid=$!
            trap '\''kill "$pulse_pid" 2>/dev/null || true'\'' EXIT

            window_id=""
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pulse_pid" 2>/dev/null; then
                cat artifacts/linux-x64/gui-launch.log
                echo "Installed Pulse executable exited unexpectedly." >&2
                exit 1
              fi
              window_id=$(xdotool search --onlyvisible --name "Pulse Supernova Linux" 2>/dev/null | head -n 1 || true)
              if [ -n "$window_id" ]; then
                break
              fi
              sleep 1
            done

            if [ -z "$window_id" ]; then
              cat artifacts/linux-x64/gui-launch.log
              echo "Pulse process remained alive but never rendered a visible window." >&2
              exit 1
            fi

            xdotool windowmap "$window_id" 2>/dev/null || true
            xdotool windowraise "$window_id" 2>/dev/null || true

            rendered=false
            render_deviation="not-captured"
            for capture_attempt in $(seq 1 5); do
              sleep 1
              if ! import -window "$window_id" artifacts/linux-x64/pulse-standard-shell.png; then
                echo "Capture attempt $capture_attempt failed while reading window $window_id." >&2
                continue
              fi

              if [ ! -s artifacts/linux-x64/pulse-standard-shell.png ]; then
                echo "Capture attempt $capture_attempt produced an empty image." >&2
                continue
              fi

              render_deviation=$(convert artifacts/linux-x64/pulse-standard-shell.png -colorspace Gray -format '%[fx:standard_deviation]' info:)
              echo "Capture attempt $capture_attempt grayscale deviation: $render_deviation"
              if awk -v deviation="$render_deviation" '\''BEGIN { exit !(deviation > 0.02) }'\''; then
                rendered=true
                break
              fi
            done

            if [ "$rendered" != true ]; then
              cat artifacts/linux-x64/gui-launch.log
              identify artifacts/linux-x64/pulse-standard-shell.png 2>/dev/null || true
              echo "Pulse rendered a window, but five captures remained blank or incomplete (final deviation: $render_deviation)." >&2
              exit 1
            fi

            kill "$pulse_pid"
            wait "$pulse_pid" || true
          '
          test -s artifacts/linux-x64/pulse-standard-shell.png
          if grep --ignore-case --extended-regexp 'unhandled exception|fatal error|core dumped' artifacts/linux-x64/gui-launch.log; then
            cat artifacts/linux-x64/gui-launch.log
            echo "Fatal startup output was detected." >&2
            exit 1
          fi
          identify artifacts/linux-x64/pulse-standard-shell.png
          echo "Installed Pulse package rendered a visible, non-blank window without fatal startup output."

      - name: Upload executable packages
        uses: actions/upload-artifact@v7
        with:
          name: pulse-linux-${{ env.PULSE_VERSION }}${{ env.PULSE_EDITION }}-linux-x64
          path: |
            artifacts/linux-x64/*.deb
            artifacts/linux-x64/*.tar.gz
            artifacts/linux-x64/SHA256SUMS
            artifacts/linux-x64/gui-launch.log
            artifacts/linux-x64/pulse-standard-shell.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified GitHub release assets
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="linux-v$PULSE_VERSION$PULSE_EDITION"
          package="artifacts/linux-x64/pulse-platform_${PULSE_VERSION}_amd64.deb"
          portable="artifacts/linux-x64/pulse-platform-${PULSE_VERSION}${PULSE_EDITION}-linux-x64.tar.gz"
          checksums="artifacts/linux-x64/SHA256SUMS"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$package" "$portable" "$checksums" --clobber
          else
            gh release create "$tag" "$package" "$portable" "$checksums" \
              --target "$GITHUB_SHA" \
              --title "Pulse Linux $PULSE_VERSION$PULSE_EDITION" \
              --notes-file RELEASE_NOTES.md
          fi

          asset_names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for expected_asset in \
            "pulse-platform_${PULSE_VERSION}_amd64.deb" \
            "pulse-platform-${PULSE_VERSION}${PULSE_EDITION}-linux-x64.tar.gz" \
            "SHA256SUMS"; do
            if ! grep --fixed-strings --line-regexp --quiet "$expected_asset" <<<"$asset_names"; then
              echo "Published release $tag is missing required updater asset: $expected_asset" >&2
              exit 1
            fi
          done

          is_prerelease="$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')"
          if [ "$is_prerelease" != "false" ]; then
            echo "Published release $tag must be a full release, not a prerelease." >&2
            exit 1
          fi
          gh release view "$tag" --json tagName,isPrerelease,assets
          echo "Published full release $tag with the complete updater asset contract."
