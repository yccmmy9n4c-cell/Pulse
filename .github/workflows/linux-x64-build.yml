name: Pulse Linux x64 Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pulse Linux package version
        required: true
        default: 0.0.0.5
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-x64-build.yml'
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
  pull_request:
    paths:
      - '.github/workflows/linux-x64-build.yml'
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'

permissions:
  contents: read

concurrency:
  group: pulse-linux-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package-test:
    name: Build, package, and inspect linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PULSE_VERSION: ${{ inputs.version || '0.0.0.5' }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install GUI launch-test dependencies
        run: sudo apt-get update && sudo apt-get install --yes xvfb xauth desktop-file-utils libx11-6 libice6 libsm6 libfontconfig1

      - name: Restore
        run: dotnet restore src/Pulse.Platform.Linux/Pulse.Platform.Linux.csproj

      - name: Compile release shell
        run: dotnet build src/Pulse.Platform.Linux/Pulse.Platform.Linux.csproj --configuration Release --no-restore --warnaserror

      - name: Run boundary and live-provider smoke tests
        run: dotnet run --project tests/Pulse.Platform.Linux.SmokeTests/Pulse.Platform.Linux.SmokeTests.csproj --configuration Release

      - name: Run one headless scheduled-assessment simulation
        run: |
          headless_root="$RUNNER_TEMP/pulse-headless-$GITHUB_RUN_ID"
          mkdir -p "$headless_root"
          XDG_DATA_HOME="$headless_root" dotnet run --project src/Pulse.Platform.Linux/Pulse.Platform.Linux.csproj --configuration Release --no-build -- --assess-once
          test -n "$(find "$headless_root/Pulse Platform/Reports" -maxdepth 1 -name '*.html' -print -quit)"
          test -n "$(find "$headless_root/Pulse Platform/Assessments" -maxdepth 1 -name '*.json' -print -quit)"

      - name: Build portable and Debian packages
        run: ./packaging/build-linux.sh linux-x64 "$PULSE_VERSION"

      - name: Verify portable archive
        run: tar -tzf "artifacts/linux-x64/pulse-platform-$PULSE_VERSION-linux-x64.tar.gz" >/dev/null

      - name: Inspect Debian package
        run: |
          dpkg-deb --info "artifacts/linux-x64/pulse-platform_${PULSE_VERSION}_amd64.deb"
          dpkg-deb --contents "artifacts/linux-x64/pulse-platform_${PULSE_VERSION}_amd64.deb"
          desktop-file-validate packaging/pulse-platform.desktop

      - name: Verify checksums
        working-directory: artifacts/linux-x64
        run: sha256sum --check SHA256SUMS

      - name: Launch shell under virtual display
        run: |
          set +e
          xvfb-run --auto-servernum timeout 8s artifacts/linux-x64/publish/pulse-platform > artifacts/linux-x64/gui-launch.log 2>&1
          launch_status=$?
          set -e
          if [ "$launch_status" -ne 124 ]; then
            cat artifacts/linux-x64/gui-launch.log
            echo "Pulse shell exited unexpectedly with status $launch_status" >&2
            exit 1
          fi
          echo "Pulse shell remained healthy for the 8-second launch check."

      - name: Upload executable packages
        uses: actions/upload-artifact@v7
        with:
          name: pulse-linux-beta-${{ env.PULSE_VERSION }}-linux-x64
          path: |
            artifacts/linux-x64/*.deb
            artifacts/linux-x64/*.tar.gz
            artifacts/linux-x64/SHA256SUMS
            artifacts/linux-x64/gui-launch.log
          if-no-files-found: error
          retention-days: 30
