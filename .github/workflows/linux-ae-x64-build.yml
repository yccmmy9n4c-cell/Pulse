name: Pulse Linux AE x64 Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pulse Linux numeric package version
        required: true
        default: 8.0.1.2
        type: string
  push:
    branches: [linux-ae]
    paths: ['.github/workflows/**', 'src/**', 'tests/**', 'packaging/**', 'Directory.Build.props', 'Directory.Packages.props', 'global.json', 'RELEASE_NOTES.md']
  pull_request:
    branches: [linux-ae]
    paths: ['.github/workflows/**', 'src/**', 'tests/**', 'packaging/**', 'Directory.Build.props', 'Directory.Packages.props', 'global.json']

permissions:
  contents: write

concurrency:
  group: pulse-linux-ae-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package-test:
    name: Build, package, and inspect Arch x64
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 35
    env:
      PULSE_VERSION: ${{ inputs.version || '8.0.1.2' }}
      PULSE_EDITION: AE
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
      AVALONIA_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Install build and GUI dependencies
        run: >-
          pacman -Syu --noconfirm
          git python base-devel libarchive zstd desktop-file-utils
          xorg-server-xvfb xorg-xauth xdotool imagemagick
          libx11 libice libsm fontconfig icu openssl krb5 zlib github-cli util-linux

      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify AE source baseline
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          expected = os.environ["PULSE_VERSION"]
          actual = ET.parse("Directory.Build.props").getroot().findtext("./PropertyGroup/Version")
          app_info = open("src/Pulse.Platform.Linux/AppInfo.cs", encoding="utf-8").read()
          if actual != expected or 'EditionCode = "AE"' not in app_info:
              raise SystemExit(f"AE source mismatch: requested {expected}, source version {actual}.")
          print(f"Source baseline verified: Pulse Linux {actual}AE")
          PY

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore src/Pulse.Platform.Linux/Pulse.Platform.Linux.csproj --runtime linux-x64
          dotnet restore tests/Pulse.Platform.Linux.SmokeTests/Pulse.Platform.Linux.SmokeTests.csproj --runtime linux-x64

      - name: Compile AE release
        run: >-
          dotnet msbuild src/Pulse.Platform.Linux/Pulse.Platform.Linux.csproj
          -target:Build -property:Configuration=Release
          -property:RuntimeIdentifier=linux-x64 -property:Restore=false
          -property:TreatWarningsAsErrors=true -nodeReuse:false

      - name: Run boundary and provider smoke tests
        run: |
          dotnet msbuild tests/Pulse.Platform.Linux.SmokeTests/Pulse.Platform.Linux.SmokeTests.csproj -target:Build -property:Configuration=Release -property:RuntimeIdentifier=linux-x64 -property:Restore=false -property:TreatWarningsAsErrors=true -nodeReuse:false
          dotnet tests/Pulse.Platform.Linux.SmokeTests/bin/Release/net10.0/linux-x64/Pulse.Platform.Linux.SmokeTests.dll

      - name: Run one headless assessment
        run: |
          headless_root="$RUNNER_TEMP/pulse-ae-headless-$GITHUB_RUN_ID"
          mkdir -p "$headless_root"
          XDG_DATA_HOME="$headless_root" dotnet src/Pulse.Platform.Linux/bin/Release/net10.0/linux-x64/pulse-platform.dll --assess-once
          test -n "$(find "$headless_root/Pulse Platform/Reports" -maxdepth 1 -name '*.html' -print -quit)"
          test -n "$(find "$headless_root/Pulse Platform/Assessments" -maxdepth 1 -name '*.json' -print -quit)"

      - name: Build portable and pacman packages as unprivileged user
        run: |
          useradd --create-home pulsebuilder
          chown -R pulsebuilder:pulsebuilder "$GITHUB_WORKSPACE"
          runuser -u pulsebuilder --preserve-environment -- ./packaging/build-arch.sh linux-x64 "$PULSE_VERSION"

      - name: Inspect and verify packages
        run: |
          tar -tzf "artifacts/linux-x64/pulse-platform-${PULSE_VERSION}${PULSE_EDITION}-linux-x64.tar.gz" >/dev/null
          bsdtar -tf "artifacts/linux-x64/pulse-platform-${PULSE_VERSION}-1-x86_64.pkg.tar.zst" | grep --fixed-strings '.PKGINFO'
          pacman -Qip "artifacts/linux-x64/pulse-platform-${PULSE_VERSION}-1-x86_64.pkg.tar.zst"
          pacman -Qlp "artifacts/linux-x64/pulse-platform-${PULSE_VERSION}-1-x86_64.pkg.tar.zst"
          desktop-file-validate packaging/pulse-platform.desktop
          (cd artifacts/linux-x64 && sha256sum --check SHA256SUMS)

      - name: Install pacman package
        run: pacman -U --noconfirm "artifacts/linux-x64/pulse-platform-${PULSE_VERSION}-1-x86_64.pkg.tar.zst"

      - name: Launch and capture installed Pulse shell
        run: |
          xvfb-run --auto-servernum bash -c '
            set -euo pipefail
            /usr/bin/pulse-platform > artifacts/linux-x64/gui-launch.log 2>&1 &
            pulse_pid=$!
            trap '\''kill "$pulse_pid" 2>/dev/null || true'\'' EXIT
            window_id=""
            for attempt in $(seq 1 20); do
              kill -0 "$pulse_pid" 2>/dev/null || { cat artifacts/linux-x64/gui-launch.log; exit 1; }
              window_id=$(xdotool search --onlyvisible --name "Pulse Supernova Linux" 2>/dev/null | head -n 1 || true)
              [ -n "$window_id" ] && break
              sleep 1
            done
            [ -n "$window_id" ] || { cat artifacts/linux-x64/gui-launch.log; exit 1; }
            sleep 2
            import -window "$window_id" artifacts/linux-x64/pulse-standard-shell.png
            kill "$pulse_pid"
            wait "$pulse_pid" || true
          '
          test -s artifacts/linux-x64/pulse-standard-shell.png
          if grep --ignore-case --extended-regexp 'unhandled exception|fatal error|core dumped' artifacts/linux-x64/gui-launch.log; then exit 1; fi
          deviation=$(convert artifacts/linux-x64/pulse-standard-shell.png -colorspace Gray -format '%[fx:standard_deviation]' info:)
          awk -v deviation="$deviation" 'BEGIN { exit !(deviation > 0.02) }'
          identify artifacts/linux-x64/pulse-standard-shell.png

      - name: Upload AE packages
        uses: actions/upload-artifact@v7
        with:
          name: pulse-linux-${{ env.PULSE_VERSION }}${{ env.PULSE_EDITION }}-linux-x64
          path: |
            artifacts/linux-x64/*.pkg.tar.zst
            artifacts/linux-x64/*.tar.gz
            artifacts/linux-x64/SHA256SUMS
            artifacts/linux-x64/gui-launch.log
            artifacts/linux-x64/pulse-standard-shell.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified AE GitHub release
        if: github.ref == 'refs/heads/linux-ae' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="linux-v$PULSE_VERSION$PULSE_EDITION"
          package="artifacts/linux-x64/pulse-platform-${PULSE_VERSION}-1-x86_64.pkg.tar.zst"
          portable="artifacts/linux-x64/pulse-platform-${PULSE_VERSION}${PULSE_EDITION}-linux-x64.tar.gz"
          checksums="artifacts/linux-x64/SHA256SUMS"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$package" "$portable" "$checksums" --clobber
          else
            gh release create "$tag" "$package" "$portable" "$checksums" --target "$GITHUB_SHA" --title "Pulse Linux $PULSE_VERSION$PULSE_EDITION" --notes-file RELEASE_NOTES.md
          fi
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for expected in "pulse-platform-${PULSE_VERSION}-1-x86_64.pkg.tar.zst" "pulse-platform-${PULSE_VERSION}${PULSE_EDITION}-linux-x64.tar.gz" SHA256SUMS; do
            grep --fixed-strings --line-regexp --quiet "$expected" <<<"$assets" || { echo "Missing release asset: $expected" >&2; exit 1; }
          done
          test "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" = false
